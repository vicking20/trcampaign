# Util.fetchClientConfig section NFS12_THERUN (read on every request).
# Keys found in the PC exe next to the section name:
#   V8ServerName, OnlinePassKillSwitch, V8XlspName, V8XlspPort, instantConnectTo, PcContentMapLength
# OnlinePassKillSwitch=true (compared with the string "true" in the exe) turns
# the Online Pass requirement off.
OnlinePassKillSwitch = true
# --- Web Autolog (profile, News, friends), see docs\AUTOLOG.md ---
# The game builds https://<V8ServerName>/Autolog/... and /Persona/... from this key.
# The server sends PUBLIC_HOST:18443 automatically when this key is not set here.
# WEB_AUTOLOG_HOST in config\server.env overrides it; "off" disables the web endpoint.
# Leave it unset unless the web host differs, e.g.:
#   V8ServerName = web.example.org:18443
