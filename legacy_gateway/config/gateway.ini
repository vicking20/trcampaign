[gateway]
; Generated first-run config normally lives at config\gateway.ini.
cert_file=certs\protossl_redirector.crt
key_file=certs\protossl_redirector.key
cipher_list=RC4-SHA:RC4-MD5:AES128-SHA:AES256-SHA:DES-CBC3-SHA
log_file=logs\gateway.log

[redirector]
enabled=1
name=REDIRECTOR
listen_host=127.0.0.1
listen_port=42129
backend_host=127.0.0.1
backend_port=42128

; The gateway's second listener is used for web Autolog, not Blaze transport.
[blaze]
enabled=1
name=WEBAUTOLOG
listen_host=0.0.0.0
listen_port=18443
backend_host=127.0.0.1
backend_port=18080
